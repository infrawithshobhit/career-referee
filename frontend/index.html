<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Referee for Engineers</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Career Referee for Engineers</h1>
            <p class="subtitle">"Not everyone should be an SRE — and this tool tells you why."</p>
        </header>

        <main>
            <section id="assessment-section" class="section">
                <h2>Assessment</h2>
                <p>Rate yourself on a scale of 1-5 for each dimension:</p>
                
                <form id="assessment-form">
                    <div class="question-group">
                        <label for="coding">Coding Skill (1 = Basic, 5 = Expert)</label>
                        <input type="range" id="coding" name="coding" min="1" max="5" value="3">
                        <span class="score-display" id="coding-score">3</span>
                    </div>

                    <div class="question-group">
                        <label for="ops">Ops Experience (1 = None, 5 = Expert)</label>
                        <input type="range" id="ops" name="ops" min="1" max="5" value="3">
                        <span class="score-display" id="ops-score">3</span>
                    </div>

                    <div class="question-group">
                        <label for="stress">Stress Tolerance (1 = Low, 5 = High)</label>
                        <input type="range" id="stress" name="stress" min="1" max="5" value="3">
                        <span class="score-display" id="stress-score">3</span>
                    </div>

                    <div class="question-group">
                        <label for="salary">Salary Ambition (1 = Moderate, 5 = Maximum)</label>
                        <input type="range" id="salary" name="salary" min="1" max="5" value="3">
                        <span class="score-display" id="salary-score">3</span>
                    </div>

                    <div class="question-group">
                        <label for="worklife">Work-Life Balance Preference (1 = Work-focused, 5 = Life-focused)</label>
                        <input type="range" id="worklife" name="worklife" min="1" max="5" value="3">
                        <span class="score-display" id="worklife-score">3</span>
                    </div>

                    <button type="submit" id="evaluate-btn" class="btn-primary">Get My Career Recommendation</button>
                </form>
            </section>

            <section id="results-section" class="section hidden">
                <h2>Your Career Match Results</h2>
                <div id="results-content">
                    <!-- Results will be populated by JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <noscript>
        <div class="no-js-message">
            <p>This application requires JavaScript to function. Please enable JavaScript in your browser.</p>
        </div>
    </noscript>

    <script src="app.js"></script>
</body>
</html>
